# Render Blueprint for Batu-Batu National Integrated High School
# RosarioSIS + Smart Campus K12

services:
  - type: web
    name: smartcampus-k12
    runtime: docker
    repo: https://github.com/kerrfairtex/SMARTK122026
    branch: mobile
    healthCheckPath: /healthz.php
    envVars:
      - key: DB_SERVER
        value: aws-0-us-east-1.pooler.supabase.com
      - key: DB_PORT
        value: "6543"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.ebyepweqwihdvjecrufk
      - key: DB_PASSWORD
        sync: true
      - key: DEFAULT_SYEAR
        value: "2026"
      - key: THEME
        value: FlatSIS
      - key: SUPABASE_SSL_MODE
        value: require
    disk:
      name: smartcampus-data
      mountPath: /var/www/html/assets
      sizeGB: 1
