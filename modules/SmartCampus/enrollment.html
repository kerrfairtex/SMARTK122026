<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enrollment — Batu-Batu NIHS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233F; --page:#F2F4F8; --card:#FFFFFF; --border:#E2E5EC;
    --text:#1B2333; --text-2:#63697A; --text-3:#9498A6; --coral:#D1573F; --coral-light:#FBE7E2;
    --gold-light:#F3E4C6; --sans:'Inter',sans-serif; --serif:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);background:var(--page);color:var(--text);font-size:13.5px;}
  .shell{display:flex;flex-direction:column;height:100vh;}
  .topbar{height:56px;background:var(--ink);display:flex;align-items:center;padding:0 20px;gap:16px;color:#fff;}
  .brand{font-family:var(--serif);font-weight:600;font-size:16px;}
  .main{flex:1;overflow-y:auto;padding:24px 28px;}
  h1.page-title{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);margin-bottom:16px;}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:16px;}
  .note{background:var(--gold-light);color:#8A5F1D;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px;}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.data th{text-align:left;color:var(--text-2);font-weight:600;font-size:11px;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--border);}
  table.data td{padding:9px 10px;border-bottom:1px solid #F0F1F5;}
  .error-banner{background:var(--coral-light);color:var(--coral);border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:14px;display:none;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><div class="brand">SmartCampus — Enrollment</div></div>
  <div class="main">
    <div class="error-banner" id="errorBanner"></div>
    <h1 class="page-title">Enrollment</h1>
    <div class="note">Read-only. Enrollment / drop codes are shown as raw values — their lookup table hasn't been confirmed yet, so labels like "Active"/"Dropped" aren't displayed until that's verified.</div>

    <div class="panel">
      <table class="data" id="enrTable">
        <tr><th>Learner</th><th>Grade</th><th>Start</th><th>End</th><th>Enroll Code</th><th>Drop Code</th></tr>
        <tr><td colspan="6" style="color:var(--text-3)">Loading enrollments…</td></tr>
      </table>
    </div>
  </div>
</div>

<script>
  var BOOT = window.SMARTCAMPUS_BOOT || {
    schoolId: 1, syear: 2026,
    ajaxUrl: 'Modules.php?modname=SmartCampus/Ajax.php',
    token: 'demo-token'
  };

  function showError(msg){
    var b = document.getElementById('errorBanner');
    b.textContent = msg;
    b.style.display = 'block';
  }

  function callService(modfunc, params){
    params = params || {};
    var url = BOOT.ajaxUrl + '&modfunc=' + encodeURIComponent(modfunc);
    Object.keys(params).forEach(function(k){ url += '&' + k + '=' + encodeURIComponent(params[k]); });
    return fetch(url, { credentials: 'same-origin' }).then(function(res){
      if (!res.ok) throw new Error('Service returned ' + res.status);
      return res.json();
    });
  }

  callService('enrollment_list').then(function(data){
    var table = document.getElementById('enrTable');
    var rows = '<tr><th>Learner</th><th>Grade</th><th>Start</th><th>End</th><th>Enroll Code</th><th>Drop Code</th></tr>';
    var enrollments = data.enrollments || [];
    if (enrollments.length === 0) {
      table.innerHTML = '<tr><td colspan="6" style="color:var(--text-3)">No enrollment records found.</td></tr>';
      return;
    }
    enrollments.forEach(function(e){
      var firstName = e.first_name || e.FIRST_NAME || '';
      var lastName = e.last_name || e.LAST_NAME || '';
      var grade = e.grade_id || e.GRADE_ID || '—';
      var startDate = e.start_date || e.START_DATE || '—';
      var endDate = e.end_date || e.END_DATE || '—';
      var enrollCode = e.enrollment_code !== null && e.enrollment_code !== undefined ? (e.enrollment_code || e.ENROLLMENT_CODE) : '—';
      var dropCode = e.drop_code !== null && e.drop_code !== undefined ? (e.drop_code || e.DROP_CODE) : '—';

      rows += '<tr>' +
        '<td>' + firstName + ' ' + lastName + '</td>' +
        '<td>' + grade + '</td>' +
        '<td>' + startDate + '</td>' +
        '<td>' + endDate + '</td>' +
        '<td>' + (enrollCode || '—') + '</td>' +
        '<td>' + (dropCode || '—') + '</td>' +
      '</tr>';
    });
    table.innerHTML = rows;
  }).catch(function(err){
    showError('Could not load enrollments: ' + err.message);
    document.getElementById('enrTable').innerHTML =
      '<tr><td colspan="6" style="color:var(--coral)">Could not load enrollments: ' + err.message + '</td></tr>';
  });
</script>
</body>
</html>
