# Render Blueprint for Batu-Batu National Integrated High School
# RosarioSIS + Smart Campus K12

services:
  - type: web
    name: smartcampus-k12
    runtime: docker
    repo: https://github.com/kerrfairtex/SMARTK122026
    branch: mobile
    healthCheckPath: /healthz.php
    envVars:
      - key: DB_SERVER
        value: aws-0-ap-northeast-1.pooler.supabase.com
      - key: DB_PORT
        value: "6543"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.ebyepweqwihdvjecrufk
      - key: DB_PASSWORD
        sync: true
      - key: DEFAULT_SYEAR
        value: "2026"
      - key: THEME
        value: FlatSIS
      - key: SUPABASE_SSL_MODE
        value: require
      - key: ADMIN_PASSWORD
        sync: false
        generateValue: true
    disk:
      name: smartcampus-data
      # Mount ONLY the uploads subdir. Mounting at all of /var/www/html/assets would
      # shadow the committed themes/logo/js and the landing-image symlink (assets/images),
      # breaking CSS, logo, and landing photos. Only FileUploads/StudentPhotos/UserPhotos
      # need persistence.
      mountPath: /var/www/html/assets/FileUploads
      sizeGB: 1
